<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Calculator</h1>
    <div id="display">
        <div class="input"></div>
        <div class="buttons">
            <button class="seven btn_style">7</button>
            <button class="eight btn_style">8</button>
            <button class="nine btn_style">9</button>
            <button class="multiply btn_style operations">*</button>
            <button class="four btn_style">4</button>
            <button class="five btn_style">5</button>
            <button class="six btn_style">6</button>
            <button class="substraction btn_style operations">-</button>
            <button class="one btn_style">1</button>
            <button class="two btn_style">2</button>
            <button class="three btn_style">3</button>
            <button class="plus btn_style operations">+</button>
            <button class="zero btn_style">0</button>
            <button class="decimal btn_style">.</button>
            <button class="division btn_style operations">/</button>
            <button class="equal btn_style operations">=</button>
        </div>
    </div>

    <script>
        const opera =document.querySelector(".input");
        opera.innerHTML="23 + 34";
    </script>
</body>
</html>
